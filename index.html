<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Unit Converter</h1>
    <div class="tab-container">
        <div class="tab">
            <button class="tablinks" id="lengthButton">Length</button>
        </div>
        <div class="tab">
            <button class="tablinks" id="weightButton">Weight</button>
        </div>
        <div class="tab">
            <button class="tablinks" id="temperatureButton">Temperature</button>
        </div>
    </div>
    <form>
        <label for="amountOfUnit" id="amountOfUnitLabel">Enter the length to covert</label><br>
        <input type="text" id="amountOfUnit" name="amountOfUnit"><br>
        <label for="convertFrom" id="convertFromLabel">Unit to Convert from</label>
        <div>
            <select name="convertFrom" id="convertFrom">
                <option value="Millimeter">Millimeter</option>
                <option value="Centimeter">Centimeter</option>
                <option value="Meter">Meter</option>
                <option value="Kilometer">Kilometer</option>
                <option value="Inch">Inch</option>
                <option value="Foot">Foot</option>
                <option value="Yard">Yard</option>
                <option value="Mile">Mile</option>
            </select>
        </div>
        <label for="convertTo" id="convertToLabel">Unit to Convert to</label>
        <div>
            <select name="convertTo" id="convertTo">
                <option value="Millimeter">Millimeter</option>
                <option value="Centimeter">Centimeter</option>
                <option value="Meter">Meter</option>
                <option value="Kilometer">Kilometer</option>
                <option value="Inch">Inch</option>
                <option value="Foot">Foot</option>
                <option value="Yard">Yard</option>
                <option value="Mile">Mile</option>
            </select>
        </div>
    </form>
    <button type="button" id="convert" onclick="convert()">Convert</button>
    <p id="resultLabel" hidden>Result of your calculation</p>
    <p id="result"></p>
    <button type="button" id="reset" onclick="reset()" hidden>Reset</button>
</body>
</html>
